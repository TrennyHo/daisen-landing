<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>呆森配件濾芯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --navy:#0a1628;          /* 官網品牌底色 */
    --navy-2:#0f2744;
    --navy-3:#16355c;
    --cyan:#00c9f0;
    --green:#06c755;         /* LINE 綠，只用在詢問按鈕 */
    --green-d:#05a847;
    --ink:#eef4fa;
    --ink-2:#9db4cd;
    --ink-3:#647e9b;
    --line:#1b3355;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--navy); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC",sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding-bottom:56px}

  header{padding:26px 20px 20px;text-align:center;border-bottom:1px solid var(--line)}
  header h1{font-size:19px;font-weight:900;letter-spacing:.5px}
  header p{font-size:12.5px;color:var(--ink-3);margin-top:3px}

  /* 機型選擇：這頁的主軸，固定在頂端 */
  .picker{
    position:sticky;top:0;z-index:10;
    background:rgba(10,22,40,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:13px 0 12px;
  }
  .picker .lbl{
    font-size:11.5px;font-weight:700;color:var(--cyan);
    letter-spacing:.14em;padding:0 20px;margin-bottom:9px;
  }
  .chips{display:flex;gap:7px;overflow-x:auto;padding:0 20px 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;font:inherit;font-size:14px;font-weight:700;
    font-family:"Montserrat","Noto Sans TC",sans-serif;
    padding:7px 15px;border-radius:999px;cursor:pointer;
    background:transparent;color:var(--ink-2);
    border:1.5px solid var(--navy-3);transition:.15s;
  }
  .chip:hover{border-color:var(--cyan);color:var(--ink)}
  .chip.on{background:var(--cyan);border-color:var(--cyan);color:var(--navy);font-weight:700}

  .count{padding:11px 20px 0;font-size:12.5px;color:var(--ink-3)}
  .count b{color:var(--ink);font-weight:700}

  /* 分類 */
  .group{padding:0 20px}
  .group h2{
    font-size:13px;font-weight:900;color:var(--cyan);letter-spacing:.1em;
    margin:26px 0 11px;display:flex;align-items:center;gap:9px;
  }
  .group h2::after{content:"";flex:1;height:1px;background:var(--line)}

  .items{display:flex;flex-direction:column;gap:9px}
  .item{
    background:var(--navy-2);border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;display:flex;gap:12px;align-items:flex-start;
  }
  .item .thumb{
    flex:none;width:56px;height:56px;border-radius:9px;overflow:hidden;
    background:var(--navy-3);
  }
  .item .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .item .info{flex:1;min-width:0}
  .item .nm{font-size:15px;font-weight:700;line-height:1.45}
  .item .de{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .item .fit{
    font-size:11px;color:var(--ink-2);margin-top:6px;
    font-family:"Montserrat","Noto Sans TC",sans-serif;letter-spacing:.02em;
  }
  .item .right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .item .pr{
    font-family:"Montserrat",sans-serif;font-size:18px;font-weight:700;
    color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .item .pr small{font-size:11px;font-weight:600;color:var(--ink-3);margin-right:1px}
  .ask{
    font:inherit;font-size:12.5px;font-weight:700;white-space:nowrap;
    padding:7px 13px;border:none;border-radius:8px;cursor:pointer;
    background:var(--green);color:#fff;transition:background .15s;
  }
  .ask:hover{background:var(--green-d)}

  /* 服務項目卡片放大一點，它是主力 */
  .item.service{
    background:linear-gradient(140deg,var(--navy-2),#123055);
    border-color:var(--navy-3);
  }
  .item.service .nm{font-size:16.5px}

  .thin{
    margin:22px 20px 0;padding:13px 15px;border-radius:11px;
    background:rgba(0,201,240,.07);border:1px solid rgba(0,201,240,.25);
    font-size:13px;color:var(--ink-2);line-height:1.65;
  }
  .thin b{color:var(--ink)}

  .foot{
    margin:30px 20px 0;padding-top:18px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink-3);line-height:1.7;
  }

  .loading{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>呆森 配件・濾芯</h1>
    <p>Dyson 副廠配件與濾芯，選機型看能用什麼</p>
  </header>

  <div class="picker">
    <div class="lbl">選擇你的機型</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="count" id="count"></div>
  <div id="list"><div class="loading">載入中…</div></div>

  <div class="foot">
    價格為單品價格，運費與優惠會在對話中為您確認。<br>
    找不到適用的品項，或不確定自己是哪個型號，直接在對話裡問我們就好。
  </div>

</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const $ = id => document.getElementById(id);
const LINE_ID = "@daisen";
const MODELS = ["V6","V7","V8","V10","V11","V12","V15"];
const ORDER  = ["清潔服務","濾芯耗材","吸頭配件"];

let ITEMS = [];
let picked = "";                 // 空字串 = 全部

/* LIFF 初始化：拿不到也不影響瀏覽，只是「詢問」會走預填訊息那條路 */
const LIFF_ID = "";              // 建好 LIFF app 後填入
let liffReady = false;
if (LIFF_ID && window.liff) {
  liff.init({ liffId: LIFF_ID })
      .then(() => { liffReady = true; })
      .catch(e => console.error("LIFF init 失敗：", e));
}

/* 商品讀後台即時資料，圖片對應表是靜態的（官網型錄那份） */
const API = "https://line-bot-admin-478147972022.asia-east1.run.app/api/daisen/public/products";
let IMAGES = {};

Promise.all([
  fetch(API, { cache: "no-store" }).then(r => {
    if (!r.ok) throw new Error("products " + r.status);
    return r.json();
  }),
  // 圖片掛掉不該讓整頁掛掉，取不到就用純文字卡片
  fetch("images.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
])
  .then(([data, imgs]) => { ITEMS = data; IMAGES = imgs; boot(); })
  .catch(e => {
    console.error("商品載入失敗：", e);
    $("list").innerHTML =
      `<div class="loading">商品資料載入失敗，請重新整理，<br>或直接在對話裡詢問我們。</div>`;
    $("count").textContent = "";
  });

function boot() {
  const all = document.createElement("button");
  all.className = "chip on"; all.textContent = "全部"; all.dataset.m = "";
  $("chips").appendChild(all);
  MODELS.forEach(m => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = m; b.dataset.m = m;
    $("chips").appendChild(b);
  });
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    picked = b.dataset.m;
    [...$("chips").children].forEach(c => c.classList.toggle("on", c === b));
    // 選到的機型可能被切在畫面邊緣，捲進來讓客人看得到自己選了什麼
    b.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    render();
  });
  render();
}

function render() {
  const list = picked ? ITEMS.filter(x => x.models.includes(picked)) : ITEMS;

  $("count").innerHTML = picked
    ? `${picked} 適用 <b>${list.length}</b> 項`
    : `全部 <b>${ITEMS.length}</b> 項`;

  let html = "";

  // V6 這類選項極少的機型，先講清楚再列，不要讓人以為壞了
  const thin = picked && list.length <= 3;
  if (thin) {
    html += `<div class="thin">
      <b>${picked} 目前只有這 ${list.length} 項適用。</b>
      吸頭配件多數為 V7 以後的快拆規格，${picked} 接口不同無法通用。
      如果你想找的東西不在這裡，在對話裡問一下，我們幫你確認有沒有替代方案。
    </div>`;
  }

  ORDER.forEach(cat => {
    const group = list.filter(x => x.category === cat);
    if (!group.length) return;
    group.sort((a, b) => a.price - b.price);
    html += `<div class="group"><h2>${esc(cat)}</h2><div class="items">`;
    group.forEach(x => {
      const isService = x.category === "清潔服務";
      // 縮圖放在這頁旁邊的 thumbs/，由 make_thumbs.py 從官網原圖產生
      const img = IMAGES[x.name];
      html += `
        <div class="item${isService ? " service" : ""}">
          ${img ? `<div class="thumb"><img src="${esc(img)}" alt="" loading="lazy"></div>` : ""}
          <div class="info">
            <div class="nm">${esc(x.name)}</div>
            ${x.description ? `<div class="de">${esc(x.description)}</div>` : ""}
            <div class="fit">適用　${esc(x.needs || x.models.join(" / "))}</div>
          </div>
          <div class="right">
            <div class="pr"><small>NT$</small>${x.price.toLocaleString()}</div>
            <button class="ask" data-n="${esc(x.name)}" data-p="${x.price}">詢問這項</button>
          </div>
        </div>`;
    });
    html += `</div></div>`;
  });

  $("list").innerHTML = html;
  $("list").querySelectorAll(".ask").forEach(b =>
    b.onclick = () => ask(b.dataset.n, +b.dataset.p));
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

/* 詢問：優先用 LIFF 直接送出（少按一次），否則走預填訊息 —— 官網已驗證的作法。
   liff.sendMessages() 從圖文選單開啟時不能用，所以一定要保留退路。 */
function ask(name, price) {
  const msg = `我想詢問：${name} $${price}`;
  const fallback = () => {
    location.href = "https://line.me/R/oaMessage/" + LINE_ID + "?" + encodeURIComponent(msg);
  };
  if (liffReady && liff.isApiAvailable && liff.isApiAvailable("sendMessages")) {
    liff.sendMessages([{ type: "text", text: msg }])
        .then(() => liff.closeWindow())
        .catch(e => { console.error("sendMessages 失敗，改用預填訊息：", e); fallback(); });
  } else {
    fallback();
  }
}
</script>
</body>
</html>
